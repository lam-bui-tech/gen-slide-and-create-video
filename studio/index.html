<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Lecture Studio — Canvas WYSIWYG Editor</title>
  <!-- Google Fonts: Be Vietnam Pro -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <!-- GSAP for animations -->
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <!-- Design Tokens & Template Styles -->
  <link rel="stylesheet" href="templates/tokens.css">
  <link rel="stylesheet" href="templates/templates.css">
  <style>
    :root {
      --sidebar-width: 340px;
      --props-width: 380px;
      --app-bg: #F8FAFC;
      --panel-bg: #FFFFFF;
      --border-color: #E2E8F0;
      --primary: #0369A1;
      --primary-hover: #0284C7;
      --text-main: #0F172A;
      --text-sub: #475569;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Be Vietnam Pro', system-ui, -apple-system, sans-serif;
      background: var(--app-bg);
      color: var(--text-main);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Top Navigation Bar */
    header.studio-navbar {
      height: 64px;
      background: var(--panel-bg);
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      z-index: 50;
    }

    .nav-brand {
      display: flex;
      align-items: center;
      gap: 12px;
      font-weight: 800;
      font-size: 18px;
      color: var(--primary);
    }

    .nav-brand-badge {
      width: 36px;
      height: 36px;
      background: linear-gradient(135deg, var(--hf-primary), var(--hf-primary-glow));
      color: white;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
    }

    .nav-project-title {
      font-size: 15px;
      font-weight: 600;
      color: var(--text-main);
      padding: 6px 14px;
      border-radius: 8px;
      background: #F1F5F9;
      border: 1px solid transparent;
      outline: none;
    }

    .nav-project-title:focus {
      border-color: var(--primary);
      background: white;
    }

    .nav-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      border: 1px solid transparent;
      transition: all 0.2s ease;
    }

    .btn-secondary {
      background: #F1F5F9;
      color: var(--text-main);
      border-color: var(--border-color);
    }
    .btn-secondary:hover {
      background: #E2E8F0;
    }

    .btn-primary {
      background: var(--primary);
      color: white;
    }
    .btn-primary:hover {
      background: var(--primary-hover);
    }

    .save-indicator {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      color: #64748B;
      font-weight: 500;
    }
    .save-indicator.saved { color: #059669; }
    .save-indicator.saving { color: #D97706; }

    /* Studio Main Layout */
    .studio-workspace {
      flex: 1;
      display: flex;
      overflow: hidden;
    }

    /* Left: Slide Navigator */
    aside.slide-navigator {
      width: var(--sidebar-width);
      background: var(--panel-bg);
      border-right: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .nav-pane-header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .nav-pane-header h3 {
      font-size: 14px;
      font-weight: 700;
      color: #475569;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .slide-list {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .slide-card-item {
      padding: 14px 16px;
      background: #F8FAFC;
      border: 2px solid var(--border-color);
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .slide-card-item:hover {
      background: #F0F9FF;
      border-color: var(--hf-primary-border);
    }

    .slide-card-item.active {
      background: #F0F9FF;
      border-color: var(--primary);
      box-shadow: 0 4px 12px rgba(3, 105, 161, 0.1);
    }

    .slide-card-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 12px;
      font-weight: 700;
      color: #64748B;
    }

    .slide-card-title {
      font-size: 14px;
      font-weight: 700;
      color: var(--text-main);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .slide-card-sub {
      font-size: 12px;
      color: #64748B;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    /* Center: Canvas Viewport */
    main.studio-canvas-area {
      flex: 1;
      background: #E2E8F0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      padding: 32px;
      overflow: hidden;
    }

    .canvas-viewport-wrapper {
      width: 960px;
      height: 540px;
      background: white;
      border-radius: 12px;
      box-shadow: 0 20px 40px rgba(15, 23, 42, 0.15);
      position: relative;
      overflow: hidden;
      transform-origin: center center;
    }

    /* Scaled 1920x1080 canvas */
    #live-canvas {
      width: 1920px;
      height: 1080px;
      transform: scale(0.5);
      transform-origin: top left;
      position: absolute;
      top: 0;
      left: 0;
      pointer-events: auto;
    }

    /* Editable on canvas styling */
    [contenteditable="true"] {
      outline: 2px dashed transparent;
      border-radius: 4px;
      transition: all 0.2s ease;
      cursor: text;
    }
    [contenteditable="true"]:hover {
      outline: 2px dashed #38BDF8;
      background: rgba(56, 189, 248, 0.08);
    }
    [contenteditable="true"]:focus {
      outline: 2px solid var(--primary);
      background: rgba(3, 105, 161, 0.1);
    }

    /* Clickable image styling */
    .editable-image {
      cursor: pointer;
      position: relative;
      transition: filter 0.2s ease;
    }
    .editable-image:hover {
      filter: brightness(0.9);
      outline: 3px dashed var(--primary);
    }

    /* Canvas Controls Toolbar */
    .canvas-controls-toolbar {
      position: absolute;
      bottom: 24px;
      display: flex;
      align-items: center;
      gap: 16px;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(12px);
      padding: 10px 24px;
      border-radius: 9999px;
      box-shadow: 0 8px 24px rgba(15, 23, 42, 0.12);
      border: 1px solid var(--border-color);
      z-index: 40;
    }

    /* Right: Properties & Customization Panel */
    aside.properties-panel {
      width: var(--props-width);
      background: var(--panel-bg);
      border-left: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      padding: 24px;
      gap: 24px;
    }

    .prop-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .prop-label {
      font-size: 13px;
      font-weight: 700;
      color: #475569;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .prop-input, .prop-select, .prop-textarea {
      width: 100%;
      padding: 10px 14px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      font-family: inherit;
      font-size: 14px;
      color: var(--text-main);
      outline: none;
      transition: border-color 0.2s;
    }
    .prop-input:focus, .prop-select:focus, .prop-textarea:focus {
      border-color: var(--primary);
    }

    /* Voice & Audio Track Box */
    .voice-track-box {
      background: #F0F9FF;
      border: 1px solid var(--hf-primary-border);
      border-radius: 12px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .voice-track-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 13px;
      font-weight: 700;
      color: var(--primary);
    }

    /* Modal for Image Selection */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.6);
      backdrop-filter: blur(4px);
      z-index: 100;
      display: none;
      align-items: center;
      justify-content: center;
    }
    .modal-overlay.open { display: flex; }

    .modal-box {
      width: 580px;
      background: white;
      border-radius: 16px;
      padding: 28px;
      box-shadow: 0 24px 48px rgba(15, 23, 42, 0.25);
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
  </style>
</head>
<body>

  <!-- Top Navigation Bar -->
  <header class="studio-navbar">
    <div class="nav-brand">
      <div class="nav-brand-badge">🎓</div>
      <span>HyperFrames Studio</span>
    </div>

    <input type="text" id="project-title-input" class="nav-project-title" value="Khái luận về Triết học và Triết học Mác - Lênin" />

    <div class="nav-actions">
      <button class="btn btn-secondary" id="btn-undo" title="Undo (Ctrl+Z)">↺ Hoàn tác</button>
      <button class="btn btn-secondary" id="btn-redo" title="Redo (Ctrl+Y)">↻ Làm lại</button>
      <div class="save-indicator saved" id="save-status">● Đã lưu</div>
      <button class="btn btn-primary" id="btn-export-mp4">🎬 Xuất Video MP4</button>
    </div>
  </header>

  <!-- Workspace 3-Pane View -->
  <div class="studio-workspace">
    <!-- Left: Slide Navigator -->
    <aside class="slide-navigator">
      <div class="nav-pane-header">
        <h3>Danh Sách Slide</h3>
        <button class="btn btn-secondary" id="btn-add-slide" style="padding: 4px 10px; font-size: 12px;">+ Thêm</button>
      </div>
      <div class="slide-list" id="slide-list-container">
        <!-- Dynamically populated -->
      </div>
    </aside>

    <!-- Center: Live WYSIWYG Canvas -->
    <main class="studio-canvas-area">
      <div class="canvas-viewport-wrapper">
        <div id="live-canvas">
          <!-- Live 1920x1080 slide content rendered here -->
        </div>
      </div>

      <!-- Controls Toolbar -->
      <div class="canvas-controls-toolbar">
        <button class="btn btn-secondary" id="btn-prev-slide">◀</button>
        <button class="btn btn-primary" id="btn-play-preview">▶ Phát Slide</button>
        <button class="btn btn-secondary" id="btn-next-slide">▶</button>
        <span id="canvas-slide-indicator" style="font-size: 14px; font-weight: 700; color: #475569;">Slide 1 / 10</span>
      </div>
    </main>

    <!-- Right: Properties & Customization Panel -->
    <aside class="properties-panel">
      <h3 style="font-size: 16px; font-weight: 800; color: var(--hf-primary);">Thiết Lập Slide Hiện Tại</h3>

      <!-- 1. Template Selector -->
      <div class="prop-group">
        <label class="prop-label">Khuôn mẫu Template</label>
        <select id="prop-template-select" class="prop-select">
          <option value="title-slide">01. Slide Mở Đầu (Title Hero)</option>
          <option value="learning-objectives">02. Mục Tiêu Bài Học (Learning Objectives)</option>
          <option value="concept-explain">03. Giải Thích Khái Niệm (Concept Explain)</option>
          <option value="bullet-breakdown">04. Phân Tích Luận Điểm (Bullet Breakdown)</option>
          <option value="image-explain">05. Sơ Đồ / Hình Ảnh Trực Quan (Image Explain)</option>
          <option value="comparison">06. So Sánh 2 Cột Đối Xứng (Comparison)</option>
          <option value="timeline">07. Trục Tiến Trình Thời Gian (Timeline)</option>
          <option value="formula-explain">08. Công Thức & Định Lý (Formula Explain)</option>
          <option value="quiz">09. Câu Hỏi Tương Tác (Quiz)</option>
          <option value="summary">10. Tổng Kết Bài Học (Summary & Takeaways)</option>
        </select>
      </div>

      <!-- 2. Layout Variant Switcher -->
      <div class="prop-group">
        <label class="prop-label">Bố cục Biến thể (Layout Variant)</label>
        <select id="prop-variant-select" class="prop-select">
          <option value="default">Mặc định (Standard)</option>
          <option value="text-left-image-right">Chữ Trái — Ảnh Phải</option>
          <option value="text-right-image-left">Ảnh Trái — Chữ Phải</option>
          <option value="stacked-top">Xếp Tầng Trên — Dưới</option>
          <option value="fullscreen">Toàn Màn Hình (Fullscreen)</option>
          <option value="no-image">Thuần Chữ (Không Ảnh)</option>
        </select>
      </div>

      <!-- 3. Animation Preset Picker -->
      <div class="prop-group">
        <label class="prop-label">Hiệu ứng Động (GSAP Preset)</label>
        <select id="prop-anim-select" class="prop-select">
          <option value="slide-in">Slide In (Trượt êm từ dưới)</option>
          <option value="fade-in">Fade In (Hiện rõ dần)</option>
          <option value="zoom-in">Zoom In (Phóng to tinh tế)</option>
          <option value="typewriter">Typewriter (Đánh máy từng chữ)</option>
          <option value="step-by-step">Step-by-step (Xuất hiện tuần tự)</option>
          <option value="highlight-keyword">Highlight Keyword (Rực sáng trọng tâm)</option>
        </select>
      </div>

      <!-- 4. Voice-over & Narration Studio (Phase 4.1 UI) -->
      <div class="voice-track-box">
        <div class="voice-track-header">
          <span>🎙️ VieNeu Thuyết Minh AI</span>
          <span id="voice-duration-badge">16.0s</span>
        </div>
        <textarea id="prop-narration-input" class="prop-textarea" rows="4" placeholder="Nhập câu thuyết minh cho slide này..."></textarea>
        <div style="display: flex; gap: 8px;">
          <button class="btn btn-secondary" id="btn-test-audio" style="flex: 1;">▶ Nghe Thử</button>
          <button class="btn btn-primary" id="btn-regen-voice" style="flex: 1;">↻ Tạo Lại Giọng Đọc</button>
        </div>
      </div>

      <!-- 5. Slide Notes -->
      <div class="prop-group">
        <label class="prop-label">Ghi Chú Giảng Viên (Speaker Notes)</label>
        <textarea id="prop-notes-input" class="prop-textarea" rows="3" placeholder="Ghi chú thêm cho bài giảng..."></textarea>
      </div>
    </aside>
  </div>

  <!-- Image Selector Modal -->
  <div class="modal-overlay" id="image-modal">
    <div class="modal-box">
      <h3 style="font-size: 18px; font-weight: 800; color: var(--hf-primary);">Chọn hoặc Thay Ảnh Minh Họa</h3>
      <input type="text" id="modal-img-url" class="prop-input" placeholder="Dán đường dẫn ảnh (URL hoặc local path)..." />
      <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 8px;">
        <img class="img-preview-opt" src="https://images.unsplash.com/photo-1456513080510-7bf3a84b82f8?w=300&q=80" style="width: 100%; height: 80px; object-fit: cover; border-radius: 8px; cursor: pointer; border: 2px solid transparent;" />
        <img class="img-preview-opt" src="https://images.unsplash.com/photo-1516979187457-637abb4f9353?w=300&q=80" style="width: 100%; height: 80px; object-fit: cover; border-radius: 8px; cursor: pointer; border: 2px solid transparent;" />
        <img class="img-preview-opt" src="https://images.unsplash.com/photo-1507842229451-7f01be7fe7ab?w=300&q=80" style="width: 100%; height: 80px; object-fit: cover; border-radius: 8px; cursor: pointer; border: 2px solid transparent;" />
      </div>
      <div style="display: flex; justify-content: flex-end; gap: 10px; margin-top: 12px;">
        <button class="btn btn-secondary" id="btn-close-modal">Hủy</button>
        <button class="btn btn-primary" id="btn-apply-img">Áp Dụng</button>
      </div>
    </div>
  </div>

  <script type="module">
    import { TEMPLATES, renderSlide } from './templates/index.js';

    // Application State Store
    class StudioStore {
      constructor() {
        this.currentSlideIndex = 0;
        this.history = [];
        this.historyIndex = -1;
        this.saveTimeout = null;
        this.activeImageTargetId = null;

        this.scene = null;
      }

      async init() {
        // Load initial scene from fixtures/scene.sample.json or localStorage
        const saved = localStorage.getItem('lecture_scene_state');
        if (saved) {
          try {
            this.scene = JSON.parse(saved);
          } catch(e) { this.scene = null; }
        }

        if (!this.scene) {
          const res = await fetch('fixtures/scene.sample.json');
          this.scene = await res.json();
        }

        this.pushHistory('Khởi tạo Studio');
        this.renderAll();
      }

      pushHistory(actionDesc) {
        if (this.historyIndex < this.history.length - 1) {
          this.history = this.history.slice(0, this.historyIndex + 1);
        }
        this.history.push(JSON.parse(JSON.stringify(this.scene)));
        this.historyIndex = this.history.length - 1;
        this.triggerAutosave();
      }

      undo() {
        if (this.historyIndex > 0) {
          this.historyIndex--;
          this.scene = JSON.parse(JSON.stringify(this.history[this.historyIndex]));
          this.renderAll();
          this.triggerAutosave();
        }
      }

      redo() {
        if (this.historyIndex < this.history.length - 1) {
          this.historyIndex++;
          this.scene = JSON.parse(JSON.stringify(this.history[this.historyIndex]));
          this.renderAll();
          this.triggerAutosave();
        }
      }

      triggerAutosave() {
        const statusEl = document.getElementById('save-status');
        if (statusEl) {
          statusEl.innerText = '● Đang lưu...';
          statusEl.className = 'save-indicator saving';
        }

        clearTimeout(this.saveTimeout);
        this.saveTimeout = setTimeout(async () => {
          localStorage.setItem('lecture_scene_state', JSON.stringify(this.scene));
          try {
            // Attempt autosave to backend if endpoint is live
            await fetch(`/projects/${this.scene.projectId || 'sample'}/scene`, {
              method: 'PUT',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(this.scene)
            });
          } catch (e) {
            // Local fallback graceful pass
          }
          if (statusEl) {
            statusEl.innerText = '● Đã lưu';
            statusEl.className = 'save-indicator saved';
          }
        }, 500);
      }

      getCurrentSlide() {
        return this.scene.slides[this.currentSlideIndex];
      }

      setSlideIndex(idx) {
        if (idx >= 0 && idx < this.scene.slides.length) {
          this.currentSlideIndex = idx;
          this.renderAll();
        }
      }

      renderAll() {
        this.renderSlideList();
        this.renderCanvas();
        this.renderProperties();
      }

      renderSlideList() {
        const container = document.getElementById('slide-list-container');
        if (!container) return;
        container.innerHTML = '';

        this.scene.slides.forEach((s, idx) => {
          const item = document.createElement('div');
          item.className = `slide-card-item ${idx === this.currentSlideIndex ? 'active' : ''}`;
          item.innerHTML = `
            <div class="slide-card-meta">
              <span>#${String(idx + 1).padStart(2, '0')} · ${s.templateId}</span>
              <span>${s.durationSeconds || 16}s</span>
            </div>
            <div class="slide-card-title">${s.title || 'Slide không tên'}</div>
            <div class="slide-card-sub">
              <span>🎙️ ${s.voice?.durationSeconds || 15}s</span>
              <span>✦ ${s.layoutVariant || 'default'}</span>
            </div>
          `;
          item.onclick = () => this.setSlideIndex(idx);
          container.appendChild(item);
        });

        const counter = document.getElementById('canvas-slide-indicator');
        if (counter) {
          counter.innerText = `Slide ${this.currentSlideIndex + 1} / ${this.scene.slides.length}`;
        }
      }

      renderCanvas() {
        const canvas = document.getElementById('live-canvas');
        if (!canvas) return;
        const slide = this.getCurrentSlide();
        if (!slide) return;

        canvas.innerHTML = renderSlide(slide, this.currentSlideIndex, 0);

        // Make on-canvas text editable
        const editableElements = canvas.querySelectorAll('.slide-title, .title-hero-sub, .concept-quote, .breakdown-title, .breakdown-body, .timeline-event-title, .formula-display-box, .question-txt, .objective-text, .summary-bullet-text');
        editableElements.forEach(el => {
          el.setAttribute('contenteditable', 'true');
          el.addEventListener('blur', (e) => {
            const newText = e.target.innerText.trim();
            if (el.classList.contains('slide-title')) {
              slide.title = newText;
            } else if (el.classList.contains('title-hero-sub')) {
              slide.subtitle = newText;
            } else if (el.classList.contains('concept-quote')) {
              const def = slide.elements.find(x => x.type === 'card' || x.type === 'text');
              if (def) def.content = newText.replace(/^[“”"]|[“”"]$/g, '');
            }
            this.pushHistory('Chỉnh sửa văn bản trực tiếp trên Canvas');
            this.renderSlideList();
          });
        });

        // Make images clickable for modal replace
        const images = canvas.querySelectorAll('img');
        images.forEach(img => {
          img.classList.add('editable-image');
          img.title = 'Click để đổi ảnh minh họa';
          img.onclick = () => {
            this.activeImageTargetId = img.id;
            openImageModal(img.src);
          };
        });
      }

      renderProperties() {
        const slide = this.getCurrentSlide();
        if (!slide) return;

        const templateSelect = document.getElementById('prop-template-select');
        const variantSelect = document.getElementById('prop-variant-select');
        const narrationInput = document.getElementById('prop-narration-input');
        const notesInput = document.getElementById('prop-notes-input');
        const durationBadge = document.getElementById('voice-duration-badge');

        if (templateSelect) templateSelect.value = slide.templateId || 'concept-explain';
        if (variantSelect) variantSelect.value = slide.layoutVariant || 'default';
        if (narrationInput) narrationInput.value = slide.voice?.narration || '';
        if (notesInput) notesInput.value = slide.notes || '';
        if (durationBadge) durationBadge.innerText = (slide.durationSeconds || 16) + 's';
      }
    }

    const store = new StudioStore();
    window.studioStore = store;
    store.init();

    // Event Bindings
    document.getElementById('btn-undo').onclick = () => store.undo();
    document.getElementById('btn-redo').onclick = () => store.redo();
    document.getElementById('btn-prev-slide').onclick = () => store.setSlideIndex(store.currentSlideIndex - 1);
    document.getElementById('btn-next-slide').onclick = () => store.setSlideIndex(store.currentSlideIndex + 1);

    document.getElementById('prop-template-select').onchange = (e) => {
      const slide = store.getCurrentSlide();
      slide.templateId = e.target.value;
      store.pushHistory('Đổi Template: ' + e.target.value);
      store.renderAll();
    };

    document.getElementById('prop-variant-select').onchange = (e) => {
      const slide = store.getCurrentSlide();
      slide.layoutVariant = e.target.value;
      store.pushHistory('Đổi Layout Variant: ' + e.target.value);
      store.renderAll();
    };

    document.getElementById('prop-narration-input').onblur = (e) => {
      const slide = store.getCurrentSlide();
      if (!slide.voice) slide.voice = {};
      slide.voice.narration = e.target.value;
      store.pushHistory('Sửa kịch bản thuyết minh');
    };

    document.getElementById('prop-notes-input').onblur = (e) => {
      const slide = store.getCurrentSlide();
      slide.notes = e.target.value;
      store.pushHistory('Sửa ghi chú giảng viên');
    };

    // Keyboard Shortcuts (Ctrl+Z, Ctrl+Y)
    window.addEventListener('keydown', (e) => {
      if ((e.ctrlKey || e.metaKey) && e.key === 'z') {
        e.preventDefault();
        if (e.shiftKey) store.redo();
        else store.undo();
      } else if ((e.ctrlKey || e.metaKey) && e.key === 'y') {
        e.preventDefault();
        store.redo();
      }
    });

    // Image Modal Logic
    function openImageModal(currentSrc) {
      const modal = document.getElementById('image-modal');
      const input = document.getElementById('modal-img-url');
      if (input) input.value = currentSrc || '';
      if (modal) modal.classList.add('open');
    }

    document.getElementById('btn-close-modal').onclick = () => {
      document.getElementById('image-modal').classList.remove('open');
    };

    document.querySelectorAll('.img-preview-opt').forEach(opt => {
      opt.onclick = () => {
        document.getElementById('modal-img-url').value = opt.src;
      };
    });

    document.getElementById('btn-apply-img').onclick = () => {
      const newUrl = document.getElementById('modal-img-url').value.trim();
      const slide = store.getCurrentSlide();
      const imgEl = slide.elements?.find(e => e.type === 'image' || e.id === store.activeImageTargetId);
      if (imgEl && newUrl) {
        imgEl.content = newUrl;
        store.pushHistory('Thay ảnh minh họa');
        store.renderCanvas();
      }
      document.getElementById('image-modal').classList.remove('open');
    };
  </script>
</body>
</html>
